# SPI + sensor
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PAW3222=y

# Pointing / trackball
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_INPUT_SPLIT=y

# Split peripheral role (no CENTRAL flag = peripheral)
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

# Name (max 16 chars)
CONFIG_ZMK_KEYBOARD_NAME="Cornix TB"

# Better BLE range (match Cornix)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Battery reporting (shows on Prospector)
CONFIG_ZMK_BATTERY_REPORTING=y

# ---- ポインタ向けに接続間隔を詰める ----
# 使用中に一瞬カーソルが止まる症状への対策。
# 既定の接続間隔(30〜50ms)だと、報告の間隔が粗くて引っかかりに感じる。
# 7.5〜15msに詰め、レイテンシを0にして毎回の接続イベントで応答させる。
# 代償として電池の持ちは短くなる（アイドル時も毎回起きるため）。
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
