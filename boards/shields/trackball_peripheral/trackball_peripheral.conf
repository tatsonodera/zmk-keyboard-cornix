# SPI + sensor
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PAW3222=y

# Pointing / trackball
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_INPUT_SPLIT=y

# Split peripheral role (no CENTRAL flag = peripheral)
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

# Name (max 16 chars)
CONFIG_ZMK_KEYBOARD_NAME="Cornix TB"

# Better BLE range (match Cornix)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Battery reporting (shows on Prospector)
CONFIG_ZMK_BATTERY_REPORTING=y

# ---- ポインタ向けに接続間隔を詰める ----
# 動かしている間の応答を良くするため、接続間隔は7.5〜15msに詰める。
#
# LATENCY は当初0にしたが、症状（使用中に一瞬止まる）は改善せず、
# 電池だけが目に見えて減ったため20に戻した。
# レイテンシは「送るデータがないときだけ接続イベントを飛ばす」仕組みなので、
# ボールを動かしている間の応答には影響しない。
# 20なら待機中は 7.5ms x 21 = 約157ms に1回しか起きず、既定より省電力。
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=20
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
