# 更改键盘默认显示名称
CONFIG_ZMK_KEYBOARD_NAME="Cornix Dongle"

CONFIG_ZMK_DISPLAY=y

CONFIG_ZMK_USB=y
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

CONFIG_PINCTRL=y
# enable display drivers

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

#BLE-passkey
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

#BLE-clean
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n

CONFIG_ZMK_POINTING=y

# 3 profiles (n+2)
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# dongle mode
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

CONFIG_BT_BAS=y

CONFIG_ZMK_BACKLIGHT=n

# BLE送信出力を+8dBmに上げる。ドングルはUSB給電なので電池のデメリットがない。
# トラックボールが使用中に一瞬止まる症状への対策（リンクは双方向なので、
# こちらを強くすると相手側の受信と接続維持が安定する）
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# zmk studio相关配置
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# ---- DYA Studio: トラックボールの実行時調整 ----
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y
# 必須: プロセッサ一覧の取得時に共有ワークキューのスタックが足りず
# MPUフォールトするため、既定値から引き上げる（モジュール側からは上書きできない）
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048

# ---- DYA Studio: スリープ等のデバイス設定をWebから変更 ----
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# ---- 断念した機能: ランタイムコンボ / ランタイムマクロ ----
# どちらも RAM 不足で載せられなかった。実測した溢れ量は以下の通り。
#
#   コンボ + マクロ（既定値）            20704 バイト超過
#   コンボ15 + マクロ15（バッファ削減）  22496 バイト超過
#   コンボ15 のみ                        19104 バイト超過
#   コンボ15 + CRC16 local id            17440 バイト超過
#
# 溢れているのは noinit（主にスレッドスタック）なので、モジュール側の
# バッファ上限（MAX_BYTES / LARGE_VALUE_MAX_SIZE / QUEUE_SIZE）を削っても
# 効果はなかった。CRC16 の local id 化だけが 1664 バイト効いた。
#
# 残り17KBを空けるには Prospector の 240x280 LCD(LVGL) を削るしかなく、
# 表示（レイヤー名・4台のバッテリー）を失うため割に合わないと判断した。
#
# コンボ自体はキーマップに静的に書けば使える（実行時編集ができないだけ）。
