# 更改键盘默认显示名称
CONFIG_ZMK_KEYBOARD_NAME="Cornix Dongle"

CONFIG_ZMK_DISPLAY=y

CONFIG_ZMK_USB=y
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

CONFIG_PINCTRL=y
# enable display drivers

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

#BLE-passkey
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

#BLE-clean
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n

CONFIG_ZMK_POINTING=y

# 3 profiles (n+2)
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# dongle mode
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

CONFIG_BT_BAS=y

CONFIG_ZMK_BACKLIGHT=n

# zmk studio相关配置
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# ---- DYA Studio: トラックボールの実行時調整 ----
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y
# 必須: プロセッサ一覧の取得時に共有ワークキューのスタックが足りず
# MPUフォールトするため、既定値から引き上げる（モジュール側からは上書きできない）
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048

# ---- DYA Studio: スリープ等のデバイス設定をWebから変更 ----
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# ---- DYA Studio: コンボの実行時編集 ----
# 1スロット約64バイトなので15個でも約1KB。ここは軽い
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_COMBO_MAX_COMBOS=15

# ---- DYA Studio: マクロの実行時編集 ----
# 既定値のままだと RAM が約20KB溢れたので、上限を切り詰めている。
# MAX_BYTES が RPC のステージングバッファと再生バッファを直接決めるので、
# ここを削るのが一番効く。96バイトでも約90文字のテキストが入る
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_ZMK_RUNTIME_MACRO_COUNT=15
CONFIG_ZMK_RUNTIME_MACRO_POOL_BYTES=1024
CONFIG_ZMK_RUNTIME_MACRO_MAX_BYTES=96
CONFIG_ZMK_RUNTIME_MACRO_QUEUE_SIZE=32
# MAX_BYTES 以上である必要がある。全設定のバッファに波及するので最小限に
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=96

# コンボは128/96、マクロは192/192を要求する。大きいほうに合わせる
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=192
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=192
