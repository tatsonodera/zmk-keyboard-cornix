include:
  # ============ Normal firmware (4-device working setup) ============
  # Dongle: central, 3 peripherals (L/R/trackball) + trackball input receiver
  - board: xiao_ble//zmk
    shield: cornix_dongle_adapter prospector_adapter tb_receiver
    snippet: studio-rpc-usb-uart nrf52840-nosd
    cmake-args: -DCONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=3 -DCONFIG_ZMK_INPUT_SPLIT=y
    artifact-name: DYA_dongle

  - board: cornix_ph_left
    artifact-name: DYA_left

  - board: cornix_right
    artifact-name: DYA_right

  - board: xiao_ble//zmk
    shield: trackball_peripheral
    snippet: nrf52840-nosd
    artifact-name: DYA_trackball

  # ============ Emergency FULLRESET builds ============
  # Wipes ALL settings + bonds on every boot (correct flash layout guaranteed).
  # Usage: flash -> power on 10s -> flash normal firmware back.
  - board: xiao_ble//zmk
    shield: cornix_dongle_adapter prospector_adapter tb_receiver
    snippet: studio-rpc-usb-uart nrf52840-nosd
    cmake-args: -DCONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=3 -DCONFIG_ZMK_INPUT_SPLIT=y -DCONFIG_ZMK_SETTINGS_RESET_ON_START=y -DCONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=y
    artifact-name: DYARESET_dongle

  - board: cornix_ph_left
    cmake-args: -DCONFIG_ZMK_SETTINGS_RESET_ON_START=y -DCONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=y
    artifact-name: DYARESET_left

  - board: cornix_right
    cmake-args: -DCONFIG_ZMK_SETTINGS_RESET_ON_START=y -DCONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=y
    artifact-name: DYARESET_right

  - board: xiao_ble//zmk
    shield: trackball_peripheral
    snippet: nrf52840-nosd
    cmake-args: -DCONFIG_ZMK_SETTINGS_RESET_ON_START=y -DCONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=y
    artifact-name: DYARESET_trackball
